name: Bug report
description: Report a problem with a released ROVER Desktop build.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Application version
      description: Use the installed version or the version on the release page if installation failed.
      placeholder: "e.g., 1.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system
      placeholder: "e.g., macOS 15, Windows 11"
    validations:
      required: true
  - type: dropdown
    id: robot
    attributes:
      label: Robot environment
      options:
        - URSim
        - Physical Universal Robots controller
        - Offline / no robot connected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: controller_version
    attributes:
      label: URSim or PolyScope version (if relevant)
  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Attach screenshots or sanitized logs. Do not include credentials or sensitive network details.
